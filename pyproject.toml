[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-service-desk"
version = "0.1.0"
description = "Week 1 starter: a deterministic IT service desk API for the AI QA Orchestration program."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "httpx>=0.27,<1.0",
    "jsonschema>=4.21,<5.0",
]

[project.optional-dependencies]
# Day 3 live adapter only. The default offline tests and mock mode do not need it.
live = [
    "openai>=2.0,<4.0",
]
dev = [
    "pytest>=8.0,<9.0",
    # Report generation: HTML and JSON reports (see README "Report generation").
    "pytest-html>=4.2,<5.0",
    "pytest-json-report>=1.5,<2.0",
]

[tool.setuptools.packages.find]
include = ["app*", "day3_lab*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
